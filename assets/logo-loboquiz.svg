<svg xmlns="http://www.w3.org/2000/svg" width="720" height="240" viewBox="0 0 720 240" role="img" aria-label="LoboQuiz UAD · Lobos UAD Trivia Master">
<style>
  .nodo{transform-box:fill-box;transform-origin:center;animation:pulso 2.6s ease-in-out infinite}
  .nodo:nth-of-type(2){animation-delay:.3s}.nodo:nth-of-type(3){animation-delay:.6s}.nodo:nth-of-type(4){animation-delay:.9s}.nodo:nth-of-type(5){animation-delay:1.2s}.nodo:nth-of-type(6){animation-delay:1.5s}
  .chispa{transform-box:fill-box;transform-origin:center;animation:destello 3.4s ease-in-out infinite}
  .red path{stroke-dasharray:40}
  svg:hover .red path{animation:trazo 1.2s ease forwards}
  svg:hover .ojo{filter:drop-shadow(0 0 5px #F6DC8E)}
  @keyframes pulso{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.5);opacity:1}}
  @keyframes destello{0%,100%{transform:scale(.85) rotate(0);opacity:.8}50%{transform:scale(1.12) rotate(45deg);opacity:1}}
  @keyframes trazo{from{stroke-dashoffset:40}to{stroke-dashoffset:0}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

