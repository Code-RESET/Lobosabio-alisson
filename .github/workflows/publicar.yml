# Publica Lobitos en GitHub Pages cada vez que se fusionan cambios a main.
# Requisito (una sola vez): Settings → Pages → Build and deployment → Source: «GitHub Actions».
name: Publicar app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Revisar antes de publicar
        run: npm run lint && npm test

      # El build lleva el commit: así los celulares detectan cada publicación como versión nueva.
      - name: Construir con la versión del commit
        run: LOBITOS_BUILD="${GITHUB_SHA::7}" npm run build

      - name: Preparar la carpeta publicada
        run: |
          mkdir _site
          cp -r index.html sw.js version.json manifest.webmanifest icons assets _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: despliegue
        uses: actions/deploy-pages@v4
