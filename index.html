<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LoboQuiz UAD</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Trivia gamificada estilo 100 Mexicanos Dijeron para dominar la guía LoboSabio de la UAD.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<script>
  if (window.tailwind) tailwind.config = {
    theme: {
      extend: {
        fontFamily: {
          display: ['"Saira Condensed"', '"Arial Narrow"', 'Arial', 'sans-serif'],
          sans: ['"Atkinson Hyperlegible"', 'system-ui', '-apple-system', 'Segoe UI', 'sans-serif']
        },
        colors: {
          papel: 'var(--papel)', superficie: 'var(--superficie)', hundido: 'var(--hundido)',
          tinta: 'var(--tinta)', tenue: 'var(--tenue)', linea: 'var(--linea)',
          guinda: 'var(--guinda)', oro: 'var(--oro)', exito: 'var(--exito)', error: 'var(--error)'
        }
      }
    }
  };
</script>
<style>
  /* Layout: encabezado fijo con la marca + navegación por modos; cada modo es una vista a una columna
     que se abre en dos columnas (contenido + panel lateral) en pantallas anchas. El "tablero" de juego
     es un set de televisión: siempre oscuro, guinda profundo con marco dorado, en ambos temas. */
  :root {
    --papel: #FAF6F5;        /* fondo general, blanco con sesgo rosado */
    --superficie: #FFFFFF;
    --hundido: #F3ECEC;
    --tinta: #1E1417;
    --tenue: #6D5A60;
    --linea: #E7DADC;
    --guinda: #7A1C33;       /* guinda académico UAD */
    --guinda-hondo: #4C0F20;
    --oro: #A9802A;          /* dorado legible sobre claro */
    --oro-vivo: #D9B45E;     /* dorado sobre oscuro */
    --exito: #1E7A50;
    --error: #B42335;
    --sobre-guinda: #FFFFFF;
    --tablero: #24080F;
    --tablero-celda: #3A0E1B;
    --tablero-texto: #FFF6EC;
    --tablero-tenue: #CDB3B9;
    --sombra: 0 1px 2px rgba(60, 15, 28, .06), 0 8px 24px -12px rgba(60, 15, 28, .18);
    --f-display: "Saira Condensed", "Arial Narrow", Arial, sans-serif;
    --f-texto: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --papel: #140C0F; --superficie: #1D1317; --hundido: #261A1F; --tinta: #F4EBED; --tenue: #B9A5AB;
      --linea: #3A2930; --guinda: #C04563; --guinda-hondo: #7A1C33; --oro: #D9B45E; --oro-vivo: #E6C878;
      --exito: #4CC08A; --error: #F0697A; --sobre-guinda: #FFFFFF;
      --sombra: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --papel: #140C0F; --superficie: #1D1317; --hundido: #261A1F; --tinta: #F4EBED; --tenue: #B9A5AB;
    --linea: #3A2930; --guinda: #C04563; --guinda-hondo: #7A1C33; --oro: #D9B45E; --oro-vivo: #E6C878;
    --exito: #4CC08A; --error: #F0697A; --sobre-guinda: #FFFFFF;
    --sombra: 0 1px 2px rgba(0,0,0,.4), 0 10px 30px -14px rgba(0,0,0,.7);
    color-scheme: dark;
  }

  html, body { min-height: 100%; }
  body { background: var(--papel); color: var(--tinta); font-family: var(--f-texto); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 60; background: var(--superficie); }
  .gutter { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; letter-spacing: .01em; line-height: 1.05; }
  .num { font-family: var(--f-display); font-variant-numeric: tabular-nums; }
  .eyebrow { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .14em; font-size: .78rem; font-weight: 700; color: var(--oro); }
  .tenue { color: var(--tenue); }
  :focus-visible { outline: 3px solid var(--oro-vivo); outline-offset: 2px; border-radius: 6px; }

  /* Encabezado */
  .encabezado { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: var(--superficie); border-bottom: 1px solid var(--linea); }
  .marca { white-space: nowrap; font-family: var(--f-display); font-weight: 800; font-size: clamp(1.2rem, 4.6vw, 1.45rem); line-height: 1; letter-spacing: .01em; }
  .marca b { color: var(--guinda); font-weight: 800; }
  .marca i { font-style: normal; color: var(--oro); }
  .nav-scroll { overflow-x: auto; scrollbar-width: none; }
  .nav-scroll::-webkit-scrollbar { display: none; }
  .nav-btn { font-family: var(--f-display); font-weight: 700; text-transform: uppercase; letter-spacing: .08em; font-size: .9rem; padding: .55rem .85rem; border-radius: 8px; color: var(--tenue); white-space: nowrap; transition: color .15s, background .15s; }
  .nav-btn:hover { color: var(--tinta); background: var(--hundido); }
  .nav-btn[aria-current="page"] { color: var(--sobre-guinda); background: var(--guinda); }

  /* Superficies y controles */
  .panel { background: var(--superficie); border: 1px solid var(--linea); border-radius: 14px; box-shadow: var(--sombra); }
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; font-family: var(--f-display); font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: .95rem; padding: .7rem 1.1rem; border-radius: 10px; border: 1px solid transparent; transition: transform .08s, filter .15s, background .15s; cursor: pointer; line-height: 1; white-space: nowrap; }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-guinda { background: var(--guinda); color: var(--sobre-guinda); }
  .btn-guinda:hover { filter: brightness(1.08); }
  .btn-oro { background: linear-gradient(180deg, #E8C877, #C39A3F); color: #2A1A06; border-color: #A7822F; }
  .btn-oro:hover { filter: brightness(1.05); }
  .btn-linea { background: transparent; color: var(--tinta); border-color: var(--linea); }
  .btn-linea:hover { background: var(--hundido); }
  .btn-sm { padding: .5rem .75rem; font-size: .82rem; border-radius: 8px; }
  .campo { width: 100%; background: var(--superficie); color: var(--tinta); border: 1.5px solid var(--linea); border-radius: 10px; padding: .75rem .9rem; font-size: 1.05rem; }
  .campo:focus { outline: none; border-color: var(--guinda); box-shadow: 0 0 0 3px color-mix(in srgb, var(--guinda) 22%, transparent); }
  select.campo { padding-right: 2rem; }
  .chip { display: inline-flex; align-items: center; gap: .3rem; font-family: var(--f-display); font-weight: 700; font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; padding: .2rem .5rem; border-radius: 6px; background: var(--hundido); color: var(--tenue); border: 1px solid var(--linea); }
  .chip-cod { background: var(--guinda); color: var(--sobre-guinda); border-color: transparent; }
  .chip-ok { color: var(--exito); border-color: color-mix(in srgb, var(--exito) 40%, transparent); background: color-mix(in srgb, var(--exito) 10%, transparent); }
  .chip-mal { color: var(--error); border-color: color-mix(in srgb, var(--error) 40%, transparent); background: color-mix(in srgb, var(--error) 10%, transparent); }
  .chip-oro { color: var(--oro); border-color: color-mix(in srgb, var(--oro) 45%, transparent); background: color-mix(in srgb, var(--oro) 10%, transparent); }
  .barra { height: 8px; border-radius: 99px; background: var(--hundido); overflow: hidden; }
  .barra > span { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--guinda), var(--oro)); transition: width .5s ease; }
  .tarjeta-opcion { text-align: left; transition: border-color .15s, transform .12s; }
  .tarjeta-opcion:hover { border-color: var(--guinda); transform: translateY(-1px); }
  .aviso { border-radius: 10px; padding: .75rem 1rem; border: 1px solid var(--linea); background: var(--hundido); }
  .aviso-ok { border-color: color-mix(in srgb, var(--exito) 45%, transparent); background: color-mix(in srgb, var(--exito) 10%, var(--superficie)); }
  .aviso-mal { border-color: color-mix(in srgb, var(--error) 45%, transparent); background: color-mix(in srgb, var(--error) 9%, var(--superficie)); }
  .aviso-casi { border-color: color-mix(in srgb, var(--oro) 50%, transparent); background: color-mix(in srgb, var(--oro) 12%, var(--superficie)); }

  /* Tablero de TV */
  .tablero { position: relative; background: radial-gradient(120% 90% at 50% 0%, #4A1222 0%, var(--tablero) 60%); border: 3px solid #B88F3A; border-radius: 18px; padding: clamp(12px, 3vw, 22px); color: var(--tablero-texto); box-shadow: inset 0 0 0 2px #5E1A2C, 0 18px 40px -20px rgba(36, 8, 15, .7); }
  .tablero-pregunta { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.25rem, 3.4vw, 1.9rem); line-height: 1.15; text-align: center; padding: .9rem 1rem; border-radius: 12px; background: #16050A; border: 1px solid #6B2236; text-wrap: balance; }
  .celdas { display: grid; gap: 8px; }
  @media (min-width: 640px) { .celdas { grid-template-columns: 1fr 1fr; grid-auto-flow: column; } }
  .celda { perspective: 900px; min-height: 64px; }
  .celda-int { position: relative; height: 100%; min-height: 64px; border-radius: 10px; display: flex; align-items: center; gap: .75rem; padding: .55rem .7rem; background: linear-gradient(180deg, #4A1424, var(--tablero-celda)); border: 1px solid #7A2A40; color: var(--tablero-texto); text-align: left; width: 100%; }
  .celda-oculta .celda-int { justify-content: center; }
  button.celda-int { cursor: pointer; }
  button.celda-int:hover { border-color: var(--oro-vivo); }
  .celda-activa .celda-int { border: 2px solid var(--oro-vivo); box-shadow: 0 0 0 3px rgba(217, 180, 94, .18), inset 0 0 18px rgba(217,180,94,.12); }
  .celda-num { flex: none; width: 2.1rem; height: 2.1rem; border-radius: 99px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 1.15rem; color: #2A1A06; background: linear-gradient(180deg, #F1D78A, #C39A3F); box-shadow: inset 0 -2px 0 rgba(0,0,0,.2); }
  .celda-revelada .celda-int { background: linear-gradient(180deg, #FFF8EA, #F1E3C4); color: #2A0B15; border-color: #D9B45E; }
  .celda-fallada .celda-int { background: linear-gradient(180deg, #2C0C15, #1E070D); color: var(--tablero-tenue); border-style: dashed; border-color: #8B3247; }
  .celda-texto { flex: 1; min-width: 0; font-family: var(--f-display); font-weight: 700; font-size: 1.12rem; line-height: 1.1; text-transform: uppercase; letter-spacing: .02em; overflow-wrap: anywhere; }
  .celda-sub { display: block; font-family: var(--f-texto); text-transform: none; letter-spacing: 0; font-weight: 400; font-size: .76rem; line-height: 1.25; opacity: .78; margin-top: .2rem; }
  .celda-pts { flex: none; min-width: 3rem; text-align: center; font-family: var(--f-display); font-weight: 800; font-size: 1.4rem; padding: .15rem .4rem; border-radius: 6px; background: #2A0B15; color: var(--oro-vivo); font-variant-numeric: tabular-nums; }
  .celda-fallada .celda-pts { background: transparent; color: #E58A98; font-size: 1.05rem; }
  .voltear .celda-int { animation: voltear .55s cubic-bezier(.2,.7,.3,1.2); transform-origin: center; }
  @keyframes voltear { 0% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
  .x-capa { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 5; }
  .x-capa .x { font-family: var(--f-display); font-weight: 800; color: #FF3B4E; font-size: clamp(5rem, 22vw, 11rem); line-height: 1; text-shadow: 0 0 30px rgba(255, 59, 78, .7), 0 6px 0 #5C0A16; animation: xgolpe .9s ease forwards; letter-spacing: -.04em; }
  @keyframes xgolpe { 0% { transform: scale(2.2); opacity: 0; } 18% { transform: scale(1); opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; transform: scale(.94); } }
  .strike { width: 2.3rem; height: 2.3rem; border-radius: 8px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 1.5rem; border: 2px solid var(--linea); color: var(--linea); background: var(--superficie); }
  .strike-on { background: var(--error); border-color: var(--error); color: #fff; }
  .marcador { background: var(--tablero); color: var(--oro-vivo); border: 2px solid #B88F3A; border-radius: 12px; padding: .35rem .9rem; text-align: center; min-width: 6.5rem; }
  .marcador b { display: block; font-family: var(--f-display); font-size: 2rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .marcador small { font-family: var(--f-display); text-transform: uppercase; letter-spacing: .14em; font-size: .68rem; color: var(--tablero-tenue); }
  .reloj { height: 6px; border-radius: 99px; background: rgba(255,255,255,.1); overflow: hidden; }
  .reloj > span { display: block; height: 100%; background: linear-gradient(90deg, #F1D78A, #C39A3F); transition: width .25s linear; }
  .reloj.urgente > span { background: linear-gradient(90deg, #FF7A88, #FF3B4E); }

  /* Tarjetas de estudio */
  .flash { perspective: 1200px; }
  .flash-int { position: relative; min-height: 15rem; transition: transform .5s ease; transform-style: preserve-3d; }
  .flash.girada .flash-int { transform: rotateY(180deg); }
  .flash-cara { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 1.5rem; border-radius: 14px; }
  .flash-frente { background: var(--superficie); border: 1px solid var(--linea); }
  .flash-reverso { transform: rotateY(180deg); background: var(--tablero); color: var(--tablero-texto); border: 2px solid #B88F3A; }

  /* Zona de carga */
  .soltar { border: 2px dashed var(--linea); border-radius: 14px; background: var(--hundido); transition: border-color .15s, background .15s; }
  .soltar.encima { border-color: var(--guinda); background: color-mix(in srgb, var(--guinda) 8%, var(--superficie)); }

  /* Anillo de dominio */
  .anillo-fondo { stroke: var(--hundido); }
  .anillo-valor { stroke: var(--guinda); transition: stroke-dashoffset .8s ease; }
  .anillo-texto { fill: var(--tinta); font-family: var(--f-display); font-weight: 800; }
  .anillo-sub { fill: var(--tenue); font-family: var(--f-display); font-weight: 600; letter-spacing: .12em; }

  /* Logo interactivo */
  .logo { display: block; flex: none; overflow: visible; }
  .logo .nodo { transform-box: fill-box; transform-origin: center; }
  .logo .chispa { transform-box: fill-box; transform-origin: center; }
  .logo-vivo .nodo { animation: pulso 2.6s ease-in-out infinite; }
  .logo-vivo .nodo:nth-of-type(2) { animation-delay: .3s; } .logo-vivo .nodo:nth-of-type(3) { animation-delay: .6s; }
  .logo-vivo .nodo:nth-of-type(4) { animation-delay: .9s; } .logo-vivo .nodo:nth-of-type(5) { animation-delay: 1.2s; }
  .logo-vivo .nodo:nth-of-type(6) { animation-delay: 1.5s; }
  .logo-vivo .chispa { animation: destello 3.4s ease-in-out infinite; }
  .logo-vivo .red path { stroke-dasharray: 40; stroke-dashoffset: 0; }
  .logo-vivo:hover .red path, .logo-vivo.activo .red path { animation: trazo 1.2s ease forwards; }
  .logo-vivo:hover .ojo, .logo-vivo.activo .ojo { filter: drop-shadow(0 0 5px #F6DC8E); }
  .logo-vivo.activo .chispa { animation: estallido .7s ease; }
  .logo-vivo { cursor: pointer; }
  @keyframes pulso { 0%, 100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.5); opacity: 1; } }
  @keyframes destello { 0%, 100% { transform: scale(.85) rotate(0); opacity: .8; } 50% { transform: scale(1.12) rotate(45deg); opacity: 1; } }
  @keyframes estallido { 0% { transform: scale(1); } 50% { transform: scale(1.9) rotate(90deg); } 100% { transform: scale(1); } }
  @keyframes trazo { from { stroke-dashoffset: 40; } to { stroke-dashoffset: 0; } }

  @keyframes entrar { from { transform: translateY(6px); } to { transform: none; } }
  .entrar { animation: entrar .35s ease both; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
</style>
</head>
<body>
<div id="app" class="min-h-full flex flex-col">

  <header class="encabezado">
    <div class="gutter max-w-6xl mx-auto flex items-center gap-3 py-2.5">
      <button type="button" class="flex items-center gap-2.5 min-w-0" data-accion="ir" data-vista="inicio" aria-label="Ir al inicio">
        <span id="logo-mini"></span>
        <span class="flex flex-col items-start min-w-0">
          <span class="marca">Lobo<b>Quiz</b> <i>UAD</i></span>
          <span class="text-[.7rem] tenue font-display uppercase tracking-[.16em] whitespace-nowrap hidden sm:block">Lobos UAD · Trivia Master</span>
        </span>
      </button>
      <nav class="hidden md:flex items-center gap-1 ml-auto" aria-label="Modos" id="nav-escritorio"></nav>
      <div class="flex items-center gap-1 ml-auto md:ml-2">
        <button type="button" class="btn btn-linea btn-sm" data-accion="sonido" id="btn-sonido" aria-pressed="true" title="Sonido">Sonido</button>
        <button type="button" class="btn btn-linea btn-sm" data-accion="tema" id="btn-tema" title="Cambiar tema">Tema</button>
      </div>
    </div>
    <nav class="md:hidden nav-scroll gutter flex gap-1 pb-2" aria-label="Modos" id="nav-movil"></nav>
  </header>

  <main class="gutter max-w-6xl mx-auto w-full flex-1 py-6 md:py-8">
    <section id="v-inicio" data-vista-sec="inicio"></section>
    <section id="v-tablero" data-vista-sec="tablero" hidden></section>
    <section id="v-concurso" data-vista-sec="concurso" hidden></section>
    <section id="v-estudio" data-vista-sec="estudio" hidden></section>
    <section id="v-documentos" data-vista-sec="documentos" hidden></section>
  </main>

  <footer class="gutter max-w-6xl mx-auto w-full py-6 text-sm tenue flex flex-wrap gap-x-4 gap-y-1 justify-between border-t border-linea">
    <span>LoboQuiz UAD · Preparación para el concurso LoboSabio</span>
    <span id="pie-banco"></span>
  </footer>
</div>

<!-- ============================================================
     BANCO BASE · extraído de "GUIA DE ESTUDIO PARA LOBOSABIO" (PDF, 5 páginas)
     Esquema:
     {
       version, fuente:{titulo, archivo, paginas},
       categorias:[{ id, codigo, nombre, preguntas:[{ id, pregunta, respuesta, alias[], puntos, nota? }] }],
       encuestas:[{ id, categoria, pregunta, respuestas:[{ texto, alias[], puntos, ref }] }]
     }
     · puntos (preguntas): relevancia 20–100, ordena el tablero como en "100 Mexicanos Dijeron".
     · alias: otras formas aceptadas al calificar (la comparación ignora acentos, artículos y mayúsculas).
     · encuestas: tableros de respuesta múltiple; puntos suman 100; ref = id de la pregunta de la guía.
     ============================================================ -->
<script type="application/json" id="banco-base">
{
  "version": 1,
  "fuente": { "titulo": "Guía de estudio LoboSabio", "archivo": "LOBOSABIO_261015_185928.pdf", "paginas": 5 },
  "categorias": [
    { "id": "historia", "codigo": "HIS", "nombre": "Historia de México", "preguntas": [
      { "id": "his-01", "pregunta": "¿En qué año inició la Independencia de México?", "respuesta": "1810", "alias": ["mil ochocientos diez"], "puntos": 100 },
      { "id": "his-02", "pregunta": "¿Quién fue el líder del movimiento de Independencia?", "respuesta": "Miguel Hidalgo y Costilla", "alias": ["Miguel Hidalgo", "Hidalgo", "Cura Hidalgo"], "puntos": 100 },
      { "id": "his-03", "pregunta": "¿Qué tratado puso fin a la guerra entre México y Estados Unidos en 1848?", "respuesta": "El Tratado de Guadalupe Hidalgo", "alias": ["Guadalupe Hidalgo"], "puntos": 60 },
      { "id": "his-04", "pregunta": "¿En qué año se promulgó la Constitución que actualmente nos rige?", "respuesta": "1917", "alias": [], "puntos": 100 },
      { "id": "his-05", "pregunta": "¿Quién fue el primer presidente de México?", "respuesta": "Guadalupe Victoria", "alias": [], "puntos": 80 },

};

const BASE = JSON.parse($('#banco-base').textContent);

/* ---------- estado ---------- */
const S = {

    BASE.categorias.forEach(c => cats.push({ ...c, docId: 'base', docNombre: BASE.fuente.titulo }));

  return { cats, encs };
}
function todasPreguntas(catId) {
  return banco().cats.filter(c => !catId || catId === 'todas' || c.id === catId)

function necesidad(p) {
  const s = S.stats[p.id];
  if (!s) return 2 + Math.random() * 0.4;

  return 1 + Math.min(s.f, 4) * 0.4 + Math.random() * 0.4;
}
const priorizar = lista => lista.map(p => [necesidad(p), p]).sort((a, b) => b[0] - a[0]).map(x => x[1]);

function registrar(id, ok) {

  const s = S.stats[id] ? { ...S.stats[id] } : { v: 0, a: 0, f: 0, r: 0 };
  s.v++; if (ok) { s.a++; s.r++; } else { s.f++; s.r = 0; }

}

/* ---------- calificación de respuestas ---------- */
const NUMEROS = { cero: 0, uno: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6, siete: 7, ocho: 8, nueve: 9, diez: 10, once: 11, doce: 12, trece: 13, catorce: 14, quince: 15, dieciseis: 16, diecisiete: 17, dieciocho: 18, diecinueve: 19, veinte: 20, veintiuno: 21, veintidos: 22, veintitres: 23, veinticuatro: 24, veinticinco: 25, veintiseis: 26, veintisiete: 27, veintiocho: 28, veintinueve: 29, treinta: 30, cien: 100 };
const VACIAS = new Set(['el', 'la', 'los', 'las', 'un', 'una', 'unos', 'unas', 'de', 'del', 'y', 'e', 'en', 'al', 'lo', 'que', 'es', 'son', 'fue', 'por', 'para', 'con', 'se', 'su', 'sus', 'entre']);
function normalizar(s) {
  return String(s ?? '').toLowerCase()
    .replace(/π/g, ' pi ')
    .replace(/\b([o0])\s*[-−–](?![a-z0-9])/g, 'o negativo')
    .replace(/\b([o0])\s*\+/g, 'o positivo')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, ' ').trim();
}
const fichas = s => normalizar(s).split(' ').filter(t => t && !VACIAS.has(t)).map(t => NUMEROS[t] !== undefined ? String(NUMEROS[t]) : t);
function lev(a, b) {
  if (a === b) return 0; if (!a.length) return b.length; if (!b.length) return a.length;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
function fichaIgual(a, b) {
  if (a === b) return true;
  if (/^\d+$/.test(a) || /^\d+$/.test(b)) return false;
  if (Math.min(a.length, b.length) < 4) return false;
  return lev(a, b) <= (Math.max(a.length, b.length) >= 8 ? 2 : 1);
}
function evaluar(respuesta, variantes) {
  const u = fichas(respuesta);
  if (!u.length) return { ok: false, casi: false, score: 0 };
  const uj = u.join(' ');
  let mejor = 0;
  for (const v of variantes) {
    const t = [...new Set(fichas(v))];
    if (!t.length) continue;
    const tj = t.join(' ');
    if (tj === uj) return { ok: true, casi: false, score: 1 };
    let sc = t.filter(x => u.some(y => fichaIgual(x, y))).length / t.length;
    const L = Math.max(tj.length, uj.length);
    if (L >= 6 && !/\d/.test(tj) && 1 - lev(tj, uj) / L >= 0.85) sc = 1;
    mejor = Math.max(mejor, sc);
  }
  return { ok: mejor >= 0.66, casi: mejor > 0 && mejor < 0.66, score: mejor };
}
const sinParentesis = s => String(s).replace(/\s*\([^)]*\)/g, '').trim();
const variantesDe = p => [...new Set([p.respuesta ?? p.texto, sinParentesis(p.respuesta ?? p.texto), ...(p.alias || [])].filter(Boolean))];
function mascara(texto) {
  return sinParentesis(texto).split(/\s+/).map(w => w.length <= 2 && !/\d/.test(w) ? w : w[0] + ' ' + '_ '.repeat(Math.max(0, w.length - 1)).trim()).join('   ');
}

let audio;
function sonar(tipo) {
  if (!S.sonido) return;
  try {
    audio = audio || new (window.AudioContext || window.webkitAudioContext)();
    const ahora = audio.currentTime;
    const tono = (f, t0, dur, forma = 'sine', vol = 0.16) => {
      const o = audio.createOscillator(), g = audio.createGain();
      o.type = forma; o.frequency.setValueAtTime(f, ahora + t0);
      g.gain.setValueAtTime(0.0001, ahora + t0); g.gain.exponentialRampToValueAtTime(vol, ahora + t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ahora + t0 + dur);
      o.connect(g).connect(audio.destination); o.start(ahora + t0); o.stop(ahora + t0 + dur + 0.05);
    };
    if (tipo === 'ok') { tono(880, 0, 0.18); tono(1320, 0.12, 0.35); }
    else if (tipo === 'mal') { tono(150, 0, 0.5, 'sawtooth', 0.12); tono(110, 0.05, 0.5, 'square', 0.06); }
    else if (tipo === 'casi') { tono(560, 0, 0.15, 'triangle'); }
    else if (tipo === 'fin') { [523, 659, 784, 1046].forEach((f, i) => tono(f, i * 0.11, 0.3, 'triangle', 0.12)); }
  } catch (e) { /* audio no disponible */ }
}

/* ---------- relojes ---------- */
let relojId = null;
function detenerRelojes() { if (relojId) { clearInterval(relojId); relojId = null; } }
function iniciarReloj(seg, alTerminar, idBarra, idNum) {
  detenerRelojes();
  if (!seg) return null;
  const fin = Date.now() + seg * 1000;
  const tick = () => {
    const rest = Math.max(0, fin - Date.now());
    const barra = document.getElementById(idBarra), num = document.getElementById(idNum);
    if (barra) { barra.firstElementChild.style.width = (rest / (seg * 1000) * 100) + '%'; barra.classList.toggle('urgente', rest < 5000); }
    if (num) num.textContent = Math.ceil(rest / 1000) + ' s';
    if (rest <= 0) { detenerRelojes(); alTerminar(); }
  };
  relojId = setInterval(tick, 200);
  requestAnimationFrame(tick);
  return fin;
}

  else if (tipo === 'pegar') {
    const t = $('#texto-pegado').value;
    if (t.trim().length < 10) { S.docsUI.error = 'Pega al menos una pregunta con su respuesta.'; render(); return; }
    S.docsUI.preview = parsearTexto(t, 'Texto pegado ' + new Date().toLocaleDateString('es-MX'));
    S.docsUI.error = S.docsUI.preview.categorias.length ? null : 'No encontré preguntas en el texto pegado.';
    render();
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.cfg) {
    const k = t.dataset.cfg;
    S.cfg[k] = t.type === 'checkbox' ? t.checked : (isNaN(+t.value) ? t.value : +t.value);
    almacen.set('cfg', S.cfg);
    if (S.vista === 'concurso') render();
    return;
  }
  const a = t.dataset.accionCambio;
  if (a === 'cat-estudio') { S.estudio.cat = t.value; armarCola(); render(); }
  else if (a === 'archivo' && t.files[0]) procesarArchivo(t.files[0]);
  else if (a === 'activar-doc') {
    if (t.dataset.doc === 'base') { S.baseActiva = t.checked; almacen.set('baseActiva', S.baseActiva); }
    else { const d = S.docs.find(x => x.id === t.dataset.doc); if (d) { d.activo = t.checked; almacen.set('docs', S.docs); } }
    S.juego = null; S.concurso = null; armarCola(); render();
  }
});
document.addEventListener('input', e => {
  if (e.target.dataset.accionInput === 'buscar-guia') {
    S.estudio.busqueda = e.target.value;
    const tmp = document.createElement('div'); tmp.innerHTML = guiaHTML();
    $('#guia-res').innerHTML = tmp.querySelector('#guia-res').innerHTML;
  }
});
document.addEventListener('keydown', e => {
  if (S.vista !== 'estudio' || S.estudio.tab !== 'tarjetas' || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) return;
  if (e.code === 'Space' && document.activeElement?.dataset.accion !== 'girar') { e.preventDefault(); $('[data-accion="girar"]')?.click(); }
  else if (S.estudio.girada && (e.key === 'ArrowRight' || e.key === '1')) $('[data-accion="tarjeta-si"]')?.click();
  else if (S.estudio.girada && (e.key === 'ArrowLeft' || e.key === '2')) $('[data-accion="tarjeta-no"]')?.click();
});
['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => {
  const z = e.target.closest?.('#zona-soltar'); if (!z) return; e.preventDefault(); z.classList.add('encima');
}));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => {
  const z = e.target.closest?.('#zona-soltar'); if (!z) return; e.preventDefault(); z.classList.remove('encima');
  if (ev === 'drop' && e.dataTransfer.files[0]) procesarArchivo(e.dataTransfer.files[0]);
}));

/* ---------- arranque ---------- */
aplicarTema();
$('#logo-mini').innerHTML = logoSVG(40);
const ancla = (location.hash || '').slice(1);
if (VISTAS.some(([id]) => id === ancla)) S.vista = ancla;
render();

// Expuesto para pruebas y depuración desde la consola.
window.LoboQuiz = { evaluar, parsearTexto, banco: () => bancoExportable(), BASE };
})();
</script>
</body>
