<style>
  /* Layout: app al estilo iOS. Encabezado translúcido con la marca; en pantallas anchas la navegación es un

  :root {

    --hundido: #E5E5EA;

    --exito: #248A3D;  --exito-fondo: #E4F5E8;

      --tinta: #FFFFFF; --tenue: #98989F; --linea: #48484A; --separador: rgba(84, 84, 88, .65);
      --guinda: #F0577C; --guinda-suave: #3A1620; --oro: #E5B24E;
      --exito: #30D158; --exito-fondo: #10301A; --error: #FF453A; --error-fondo: #3B1513; --oro-fondo: #362A10;

  }
  :root[data-theme="dark"] {

  .icono-btn { width: 36px; height: 36px; border-radius: 999px; display: grid; place-items: center; background: var(--relleno); color: var(--guinda); flex: none; }
  .icono-btn svg { width: 20px; height: 20px; }
  .tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 50; display: grid; grid-template-columns: repeat(4, 1fr); background: var(--material); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--separador); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); }

  .nav-scroll { overflow-x: auto; scrollbar-width: none; }
  .nav-scroll::-webkit-scrollbar { display: none; }

  /* Superficies y listas agrupadas */
  .panel { background: var(--superficie); border-radius: 14px; box-shadow: var(--sombra); }
  .lista { background: var(--superficie); border-radius: 14px; box-shadow: var(--sombra); overflow: hidden; }
  .fila { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 52px; padding: 10px 16px; text-align: left; color: var(--tinta); }
  .fila + .fila::before { content: ""; position: absolute; top: 0; right: 0; left: var(--sangria, 16px); border-top: .5px solid var(--separador); }
  button.fila:active, a.fila:active { background: var(--hundido); }
  .chevron { flex: none; margin-left: auto; color: var(--linea); }

  .icono-cuadro svg { width: 18px; height: 18px; }
  .campo-fila { margin-left: auto; max-width: 60%; background: transparent; border: 0; color: var(--tenue); font: inherit; text-align: right; text-align-last: right; padding: 4px 0; cursor: pointer; }
  .interruptor { -webkit-appearance: none; appearance: none; flex: none; margin-left: auto; width: 51px; height: 31px; border-radius: 999px; background: var(--relleno); position: relative; cursor: pointer; transition: background .2s; }
  .interruptor::before { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 999px; background: #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, .15), 0 1px 1px rgba(0, 0, 0, .16); transition: transform .2s; }
  .interruptor:checked { background: #34C759; }
  .interruptor:checked::before { transform: translateX(20px); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: .45rem; min-height: 48px; padding: .75rem 1.25rem; border-radius: 12px; font-family: var(--f-texto); font-weight: 600; font-size: 1.0625rem; letter-spacing: -.01em; line-height: 1.1; white-space: nowrap; border: 0; cursor: pointer; transition: opacity .15s, transform .08s; }
  .btn:active { opacity: .7; }
  .btn:disabled { opacity: .4; cursor: not-allowed; }
  .btn-guinda, .btn-oro { background: var(--guinda); color: var(--sobre-guinda); }
  .btn-linea { background: var(--relleno); color: var(--guinda); }
  .btn-sm { min-height: 34px; padding: .4rem .9rem; font-size: .9375rem; border-radius: 999px; }
  .campo { width: 100%; background: var(--relleno); color: var(--tinta); border: 0; border-radius: 10px; padding: .75rem .9rem; font-size: 1.0625rem; font-family: inherit; }
  .campo::placeholder { color: var(--tenue); }
  .campo:focus { outline: none; box-shadow: 0 0 0 3px var(--guinda-suave), inset 0 0 0 1px var(--guinda); }
  .chip { display: inline-flex; align-items: center; gap: .3rem; font-size: .75rem; font-weight: 600; padding: .15rem .5rem; border-radius: 6px; background: var(--relleno); color: var(--tenue); }
  .chip-cod { background: var(--guinda-suave); color: var(--guinda); }
  .chip-ok { background: var(--exito-fondo); color: var(--exito); }
  .chip-mal { background: var(--error-fondo); color: var(--error); }
  .chip-oro { background: var(--oro-fondo); color: var(--oro); }
  .barra { height: 6px; border-radius: 99px; background: var(--relleno); overflow: hidden; }
  .barra > span { display: block; height: 100%; border-radius: 99px; background: var(--guinda); transition: width .5s ease; }
  .tarjeta-opcion { text-align: left; transition: transform .12s; }
  .tarjeta-opcion:active { transform: scale(.98); }
  .aviso { border-radius: 12px; padding: .8rem 1rem; background: var(--relleno); }
  .aviso-ok { background: var(--exito-fondo); }
  .aviso-mal { background: var(--error-fondo); }
  .aviso-casi { background: var(--oro-fondo); }

  /* Escena de pregunta (Modo Concurso) */
  .escena { position: relative; overflow: hidden; background: var(--superficie); border-radius: 20px; padding: clamp(16px, 3vw, 24px); box-shadow: var(--sombra); }
  .escena-pregunta { font-family: var(--f-display); font-weight: 700; font-size: clamp(1.4rem, 3.8vw, 2rem); line-height: 1.2; letter-spacing: -.022em; text-wrap: balance; }
  .reloj { height: 4px; border-radius: 99px; background: var(--relleno); overflow: hidden; }
  .reloj > span { display: block; height: 100%; background: var(--guinda); transition: width .25s linear; }
  .reloj.urgente > span { background: var(--error); }
  .strike { width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; font-size: .85rem; font-weight: 700; background: var(--relleno); color: var(--tenue); }
  .strike-on { background: var(--error); color: #fff; }
  .marcador { background: var(--superficie); border-radius: 14px; box-shadow: var(--sombra); padding: .35rem .9rem; text-align: center; min-width: 5.5rem; }
  .marcador b { display: block; font-size: 1.6rem; font-weight: 700; line-height: 1.1; color: var(--guinda); font-variant-numeric: tabular-nums; }
  .marcador small { font-size: .72rem; color: var(--tenue); }
  .x-capa { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; z-index: 5; }
  .x-capa .x { width: 92px; height: 92px; border-radius: 999px; display: grid; place-items: center; background: var(--error); color: #fff; font-size: 3rem; font-weight: 700; box-shadow: 0 10px 30px -8px rgba(215, 0, 21, .55); animation: xgolpe .9s ease forwards; }
  @keyframes xgolpe { 0% { transform: scale(.4); opacity: 0; } 20% { transform: scale(1); opacity: 1; } 75% { opacity: 1; } 100% { opacity: 0; transform: scale(.94); } }

  /* Barra de resultado fija: el resultado aparece abajo sin mover la pregunta ni las opciones */
  .accion-fija { position: fixed; left: 0; right: 0; z-index: 45; bottom: calc(57px + env(safe-area-inset-bottom, 0px)); background: var(--material); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px); border-top: .5px solid var(--separador); padding-top: 10px; padding-bottom: 10px; animation: subir .22s ease-out; }
  @media (min-width: 768px) { .accion-fija { bottom: 0; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); } }
  .accion-fija .aviso { max-height: 32vh; overflow-y: auto; padding: .6rem .85rem; font-size: .9375rem; }
  .espacio-accion { height: 190px; }
  @keyframes subir { from { transform: translateY(100%); } to { transform: none; } }
  .pts-mini { font-size: 1.25rem; font-weight: 700; color: var(--guinda); font-variant-numeric: tabular-nums; line-height: 1; }
  .strike-mini { width: 20px; height: 20px; font-size: .65rem; }

  /* Opciones A·B·C */
  .opciones { display: grid; gap: 10px; }
  @media (min-width: 640px) { .opciones { grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); } }
  .opcion { display: flex; align-items: center; gap: .75rem; min-height: 58px; width: 100%; padding: .7rem .9rem; text-align: left; border-radius: 14px; background: var(--superficie); color: var(--tinta); box-shadow: var(--sombra); border: 0; font-weight: 500; font-size: 1.0625rem; line-height: 1.25; cursor: pointer; transition: background .15s, transform .08s; overflow-wrap: anywhere; }
  .opcion:active:not(:disabled) { transform: scale(.98); background: var(--hundido); }
  .opcion:disabled { cursor: default; }
  .opcion-letra { flex: none; width: 30px; height: 30px; border-radius: 999px; display: grid; place-items: center; font-weight: 600; font-size: .95rem; background: var(--relleno); color: var(--guinda); }
  .opcion-ok { background: var(--exito-fondo); box-shadow: inset 0 0 0 2px var(--exito); }
  .opcion-ok .opcion-letra { background: var(--exito); color: #fff; }
  .opcion-mal { background: var(--error-fondo); box-shadow: inset 0 0 0 2px var(--error); }
  .opcion-mal .opcion-letra { background: var(--error); color: #fff; }
  .opcion-fuera { opacity: .35; text-decoration: line-through; }
  .opcion-tenue { opacity: .5; }
  .segmento { display: inline-flex; padding: 2px; border-radius: 9px; background: var(--relleno); max-width: 100%; }
  .segmento button { font-size: .8125rem; font-weight: 500; padding: .32rem .8rem; border-radius: 7px; color: var(--tinta); white-space: nowrap; transition: background .2s; }
  .segmento button[aria-pressed="true"], .segmento button[aria-selected="true"] { background: var(--seg-activo); font-weight: 600; box-shadow: 0 1px 3px rgba(0, 0, 0, .12), 0 0 0 .5px rgba(0, 0, 0, .04); }

  /* Tarjetas de estudio */
  .flash { perspective: 1200px; }
  .flash-int { position: relative; min-height: 15rem; transition: transform .5s ease; transform-style: preserve-3d; }
  .flash.girada .flash-int { transform: rotateY(180deg); }
  .flash-cara { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding: 1.5rem; border-radius: 20px; }
  .flash-frente { background: var(--superficie); box-shadow: var(--sombra); }
  .flash-reverso { transform: rotateY(180deg); background: var(--guinda); color: #fff; }
  .flash-reverso .eyebrow { color: rgba(255, 255, 255, .75); }

  /* Zona de carga */
  .soltar { border: 2px dashed var(--linea); border-radius: 14px; background: var(--superficie); transition: border-color .15s, background .15s; }
  .soltar.encima { border-color: var(--guinda); background: var(--guinda-suave); }

  /* Anillo de dominio */
  .anillo-fondo { stroke: var(--relleno); }
  .anillo-valor { stroke: var(--guinda); transition: stroke-dashoffset .8s ease; }
  .anillo-texto { fill: var(--tinta); font-family: var(--f-display); font-weight: 700; }
  .anillo-sub { fill: var(--tenue); font-family: var(--f-texto); font-weight: 500; letter-spacing: .06em; }

  /* Logo interactivo */
  .logo { display: block; flex: none; overflow: visible; }
  .logo .nodo { transform-box: fill-box; transform-origin: center; }
  .logo .chispa { transform-box: fill-box; transform-origin: center; }
  .logo-vivo .nodo { animation: pulso 2.6s ease-in-out infinite; }
  .logo-vivo .nodo:nth-of-type(2) { animation-delay: .3s; } .logo-vivo .nodo:nth-of-type(3) { animation-delay: .6s; }
  .logo-vivo .nodo:nth-of-type(4) { animation-delay: .9s; } .logo-vivo .nodo:nth-of-type(5) { animation-delay: 1.2s; }
  .logo-vivo .nodo:nth-of-type(6) { animation-delay: 1.5s; }
  .logo-vivo .chispa { animation: destello 3.4s ease-in-out infinite; }
  .logo-vivo .red path { stroke-dasharray: 40; stroke-dashoffset: 0; }
  .logo-vivo:hover .red path, .logo-vivo.activo .red path { animation: trazo 1.2s ease forwards; }
  .logo-vivo:hover .ojo, .logo-vivo.activo .ojo { filter: drop-shadow(0 0 5px #F6DC8E); }
  .logo-vivo.activo .chispa { animation: estallido .7s ease; }
  .logo-vivo { cursor: pointer; }
  @keyframes pulso { 0%, 100% { transform: scale(1); opacity: .85; } 50% { transform: scale(1.5); opacity: 1; } }
  @keyframes destello { 0%, 100% { transform: scale(.85) rotate(0); opacity: .8; } 50% { transform: scale(1.12) rotate(45deg); opacity: 1; } }
  @keyframes estallido { 0% { transform: scale(1); } 50% { transform: scale(1.9) rotate(90deg); } 100% { transform: scale(1); } }
  @keyframes trazo { from { stroke-dashoffset: 40; } to { stroke-dashoffset: 0; } }

  @keyframes entrar { from { transform: translateY(6px); } to { transform: none; } }
  [data-vista-sec].nueva > * { animation: entrar .3s ease both; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
  }
  .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
</style>

     {

{

<script>

'use strict';
document.documentElement.lang = 'es';

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const barajar = a => { const b = [...a]; for (let i = b.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; } return b; };
const uid = () => Math.random().toString(36).slice(2, 8);
const almacen = {
  get(k, d) { try { const v = localStorage.getItem('loboquiz:' + k); return v ? JSON.parse(v) : d; } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('loboquiz:' + k, JSON.stringify(v)); } catch (e) { /* almacenamiento no disponible */ } }
};

const BASE = JSON.parse($('#banco-base').textContent);

/* ---------- estado ---------- */
const S = {
  vista: 'inicio',
  tema: almacen.get('tema', 'dark') === 'light' ? 'light' : 'dark',
  sonido: almacen.get('sonido', true),
  stats: almacen.get('stats', {}),
  docs: almacen.get('docs', []),
  baseActiva: almacen.get('baseActiva', true),
  record: { concurso: 0, ...almacen.get('record', {}) },
  cfg: { cqNum: 10, cqTiempo: 15, cqCat: 'todas', cqElim: true, modoResp: 'opciones', ...almacen.get('cfg', {}) },
  concurso: null,
  estudio: { tab: 'practica', cat: 'todas', cola: [], idx: 0, fase: 'pregunta', res: null, girada: false, busqueda: '', vuelta: false },
  docsUI: { preview: null, procesando: false, error: null, confirmar: null, verJson: false }
};
const guardarStats = () => almacen.set('stats', S.stats);

/* ---------- banco activo ---------- */
function banco() {
  const cats = [];
  if (S.baseActiva) BASE.categorias.forEach(c => cats.push({ ...c, docId: 'base', docNombre: BASE.fuente.titulo }));
  S.docs.filter(d => d.activo).forEach(d => d.categorias.forEach(c => cats.push({ ...c, docId: d.id, docNombre: d.nombre })));
  return { cats };
}
function todasPreguntas(catId) {
  return banco().cats.filter(c => !catId || catId === 'todas' || c.id === catId)
    .flatMap(c => c.preguntas.map(p => ({ ...p, catId: c.id, catNombre: c.nombre, codigo: c.codigo })));
}
function preguntaPorId(id) { return todasPreguntas().find(p => p.id === id) || null; }
const dominada = id => (S.stats[id]?.r || 0) >= 2;
function estadoPregunta(id) {
  const s = S.stats[id];
  if (!s) return { cls: '', txt: 'Nueva' };
  if (s.r >= 2) return { cls: 'chip-ok', txt: 'Dominada' };
  if (s.f > 0 && s.r === 0) return { cls: 'chip-mal', txt: 'Con errores' };
  return { cls: 'chip-oro', txt: 'En progreso' };
}
function dominio(catId) {
  const qs = todasPreguntas(catId);
  const d = qs.filter(q => dominada(q.id)).length;
  return { total: qs.length, dom: d, pct: qs.length ? Math.round(d / qs.length * 100) : 0 };
}
function necesidad(p) {
  const s = S.stats[p.id];
  if (!s) return 2 + Math.random() * 0.4;
  if (s.r >= 2) return Math.random() * 0.4;
  return 1 + Math.min(s.f, 4) * 0.4 + Math.random() * 0.4;
}
const priorizar = lista => lista.map(p => [necesidad(p), p]).sort((a, b) => b[0] - a[0]).map(x => x[1]);

function registrar(id, ok) {
  const prev = S.stats[id] ? { ...S.stats[id] } : null;
  const s = S.stats[id] ? { ...S.stats[id] } : { v: 0, a: 0, f: 0, r: 0 };
  s.v++; if (ok) { s.a++; s.r++; } else { s.f++; s.r = 0; }
  s.t = Date.now(); S.stats[id] = s; guardarStats();
  return prev;
}
function corregirARegistroCorrecto(id, prev) {
  if (prev) S.stats[id] = prev; else delete S.stats[id];

/* ---------- calificación de respuestas ---------- */
const NUMEROS = { cero: 0, uno: 1, dos: 2, tres: 3, cuatro: 4, cinco: 5, seis: 6, siete: 7, ocho: 8, nueve: 9, diez: 10, once: 11, doce: 12, trece: 13, catorce: 14, quince: 15, dieciseis: 16, diecisiete: 17, dieciocho: 18, diecinueve: 19, veinte: 20, veintiuno: 21, veintidos: 22, veintitres: 23, veinticuatro: 24, veinticinco: 25, veintiseis: 26, veintisiete: 27, veintiocho: 28, veintinueve: 29, treinta: 30, cien: 100 };
const VACIAS = new Set(['el', 'la', 'los', 'las', 'un', 'una', 'unos', 'unas', 'de', 'del', 'y', 'e', 'en', 'al', 'lo', 'que', 'es', 'son', 'fue', 'por', 'para', 'con', 'se', 'su', 'sus', 'entre']);
function normalizar(s) {
  return String(s ?? '').toLowerCase()
    .replace(/π/g, ' pi ')
    .replace(/\b([o0])\s*[-−–](?![a-z0-9])/g, 'o negativo')
    .replace(/\b([o0])\s*\+/g, 'o positivo')
    .normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, ' ').trim();
}
const fichas = s => normalizar(s).split(' ').filter(t => t && !VACIAS.has(t)).map(t => NUMEROS[t] !== undefined ? String(NUMEROS[t]) : t);
function lev(a, b) {
  if (a === b) return 0; if (!a.length) return b.length; if (!b.length) return a.length;
  let prev = Array.from({ length: b.length + 1 }, (_, i) => i);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
function fichaIgual(a, b) {
  if (a === b) return true;
  if (/^\d+$/.test(a) || /^\d+$/.test(b)) return false;
  if (Math.min(a.length, b.length) < 4) return false;
  return lev(a, b) <= (Math.max(a.length, b.length) >= 8 ? 2 : 1);
}
function evaluar(respuesta, variantes) {
  const u = fichas(respuesta);
  if (!u.length) return { ok: false, casi: false, score: 0 };
  const uj = u.join(' ');
  let mejor = 0;
  for (const v of variantes) {
    const t = [...new Set(fichas(v))];
    if (!t.length) continue;
    const tj = t.join(' ');
    if (tj === uj) return { ok: true, casi: false, score: 1 };
    let sc = t.filter(x => u.some(y => fichaIgual(x, y))).length / t.length;
    const L = Math.max(tj.length, uj.length);
    if (L >= 6 && !/\d/.test(tj) && 1 - lev(tj, uj) / L >= 0.85) sc = 1;
    mejor = Math.max(mejor, sc);
  }
  return { ok: mejor >= 0.66, casi: mejor > 0 && mejor < 0.66, score: mejor };
}
const sinParentesis = s => String(s).replace(/\s*\([^)]*\)/g, '').trim();
const variantesDe = p => [...new Set([p.respuesta ?? p.texto, sinParentesis(p.respuesta ?? p.texto), ...(p.alias || [])].filter(Boolean))];
function mascara(texto) {
  return sinParentesis(texto).split(/\s+/).map(w => w.length <= 2 && !/\d/.test(w) ? w : w[0] + ' ' + '_ '.repeat(Math.max(0, w.length - 1)).trim()).join('   ');
}

/* ---------- opciones múltiples ---------- */
const LETRAS = 'ABCDEFGHIJKL';
const usaOpciones = () => S.cfg.modoResp !== 'escribir';
const esNumero = t => /^-?\d+([.,]\d+)?$/.test(String(t).trim());
const PALABRA_NUM = Object.fromEntries(Object.entries(NUMEROS).map(([w, n]) => [n, w]));
const PALABRA_BONITA = { dieciseis: 'dieciséis', veintidos: 'veintidós', veintitres: 'veintitrés', veintiseis: 'veintiséis' };
function opcionesPara(q, total = 3) {
  const correcta = sinParentesis(q.respuesta);
  const vars = variantesDe(q);
  const vistos = new Set([normalizar(correcta)]);
  const malas = [];
  const tomar = t => {
    const k = normalizar(t);
    if (!k || vistos.has(k) || evaluar(t, vars).ok) return;
    vistos.add(k); malas.push(t);
  };
  if (q.distractores && q.distractores.length) {
    barajar(q.distractores).forEach(t => { const k = normalizar(t); if (malas.length < total - 1 && k && !vistos.has(k)) { vistos.add(k); malas.push(t); } });
  }
  const otras = todasPreguntas().filter(p => p.id !== q.id).map(p => ({ t: sinParentesis(p.respuesta), cat: p.catId }));
  const nk = normalizar(correcta);
  const fecha = correcta.match(/^((?:el\s+)?)(\d{1,2})( de [a-záéíóú]+)$/i);
  if (malas.length >= total - 1) { /* completo con los distractores de la guía */ }
  else if (fecha) {
    barajar([1, -1, 7, -7, 10, 2]).forEach(k => { const d = +fecha[2] + k; if (d >= 1 && d <= 31 && malas.length < total - 1) tomar(fecha[1] + d + fecha[3]); });
  } else if (esNumero(correcta)) {
    const v = parseFloat(correcta.replace(',', '.'));
    const dec = (correcta.split(/[.,]/)[1] || '').length;
    const anio = !dec && v >= 1400 && v <= 2100;
    barajar(otras.filter(o => esNumero(o.t) && (anio ? (+o.t >= 1400 && +o.t <= 2100) : (+o.t > 0 && +o.t / Math.max(v, 1) <= 3 && Math.max(v, 1) / +o.t <= 3))))
      .forEach(o => { if (malas.length < total - 1) tomar(o.t); });
    const base = anio ? 10 : dec ? Math.pow(10, -dec) * 2 : Math.max(1, Math.round(Math.abs(v) * 0.1));
    const saltos = barajar([1, -1, 2, -2, 3, -3]);
    for (const k of saltos) { if (malas.length >= total - 1) break; const x = v + k * base; if (x >= 0) tomar(dec ? x.toFixed(dec) : String(x)); }
  } else if (NUMEROS[nk] !== undefined) {
    const n = NUMEROS[nk], mayus = correcta[0] === correcta[0].toUpperCase();
    barajar([1, -1, 2, -2]).forEach(k => {
      const w = PALABRA_NUM[n + k];
      if (w && malas.length < total - 1) { const b = PALABRA_BONITA[w] || w; tomar(mayus ? b[0].toUpperCase() + b.slice(1) : b); }
    });
  }
  if (malas.length < total - 1) {
    const palabras = correcta.split(/\s+/).length;
    const art = /^(el|la|los|las)\s/i.test(correcta);
    const tipo = t => /^(el|la|los|las)\s/i.test(t) ? 'concepto' : /^(\p{Lu}[\p{L}'-]+)(\s+(de|del|y|van|von|la)?\s*\p{Lu}[\p{L}'-]+)+$/u.test(t) ? 'nombre' : t.split(/\s+/).length === 1 ? 'palabra' : 'frase';
    const miTipo = tipo(correcta);
    otras.filter(o => !esNumero(o.t))
      .map(o => [(tipo(o.t) === miTipo ? 4 : 0) + (o.cat === q.catId ? 3 : 0) + (Math.abs(o.t.split(/\s+/).length - palabras) <= 1 ? 1 : 0) + (/^(el|la|los|las)\s/i.test(o.t) === art ? 1 : 0) + Math.random() * 1.5, o.t])
      .sort((a, b) => b[0] - a[0])
      .forEach(([, t]) => { if (malas.length < total - 1) tomar(t); });
  }
  return barajar([{ texto: correcta, ok: true }, ...malas.map(t => ({ texto: t, ok: false }))]);
}
// ops: [{texto, ok, elegida, fuera, usada}] · revelar: muestra correctas/incorrectas tras responder
function opcionesHTML(ops, accion, { revelar = false, cols = 3 } = {}) {
  return `<div class="opciones" style="--cols:${cols}" role="group" aria-label="Opciones de respuesta">${ops.map((o, i) => {
    let cls = 'opcion';
    if (o.fuera) cls += ' opcion-fuera';
    else if (revelar) cls += o.ok ? ' opcion-ok' : o.elegida ? ' opcion-mal' : ' opcion-tenue';
    else if (o.usada) cls += o.ok ? ' opcion-ok' : ' opcion-mal';
    const off = revelar || o.fuera || o.usada;
    return `<button type="button" class="${cls}" data-accion="${accion}" data-o="${i}" ${off ? 'disabled' : `data-tecla="${LETRAS[i]}"`}><span class="opcion-letra">${LETRAS[i]}</span><span class="min-w-0">${esc(o.texto)}</span></button>`;
  }).join('')}</div>`;
}

}

      o.connect(g).connect(audio.destination); o.start(ahora + t0); o.stop(ahora + t0 + dur + 0.05);

function iniciarReloj(seg, alTerminar, idBarra, idNum) {
  detenerRelojes();

  const fin = Date.now() + seg * 1000;
  const tick = () => {
    const rest = Math.max(0, fin - Date.now());
    const barra = document.getElementById(idBarra), num = document.getElementById(idNum);
    if (barra) { barra.firstElementChild.style.width = (rest / (seg * 1000) * 100) + '%'; barra.classList.toggle('urgente', rest < 5000); }
    if (num) num.textContent = Math.ceil(rest / 1000) + ' s';
    if (rest <= 0) { detenerRelojes(); alTerminar(); }
  };
  relojId = setInterval(tick, 200);
  requestAnimationFrame(tick);
  return fin;
}

function iniciarConcurso() {
  const pool = priorizar(todasPreguntas(S.cfg.cqCat));
  if (!pool.length) return;
  const lista = barajar(pool.slice(0, Math.min(S.cfg.cqNum, pool.length)));
  S.concurso = { lista, i: 0, puntos: 0, strikes: 0, racha: 0, mejorRacha: 0, res: [], tiempos: [], fallos: [], fase: 'pregunta', msg: null };
  preguntaConcurso();
}
function preguntaConcurso() {
  const C = S.concurso;
  C.fase = 'pregunta'; C.msg = null; C.inicio = Date.now(); C.ops = opcionesPara(C.lista[C.i]); C.porOpcion = false;
  render(); enfocar('#resp-cq');
  iniciarReloj(S.cfg.cqTiempo, () => { if (S.concurso === C && C.fase === 'pregunta') responderConcurso('', true); }, 'reloj-cq', 'reloj-cq-num');
}
function responderConcurso(texto, agotado = false, okForzado) {
  const C = S.concurso;
  if (!C || C.fase !== 'pregunta') return;
  detenerRelojes();
  const q = C.lista[C.i], t = texto.trim();
  const seg = (Date.now() - C.inicio) / 1000;
  const r = okForzado !== undefined ? { ok: okForzado } : t ? evaluar(t, variantesDe(q)) : { ok: false };
  C.porOpcion = okForzado !== undefined;
  C.tiempos.push(seg); C.ultimoTexto = t; C.ultimoOk = r.ok;
  C.prev = registrar(q.id, r.ok);
  if (r.ok) {
    C.racha++; C.mejorRacha = Math.max(C.mejorRacha, C.racha);
    const mult = C.racha >= 5 ? 2 : C.racha >= 3 ? 1.5 : 1;
    const bono = S.cfg.cqTiempo ? Math.round(50 * Math.max(0, 1 - seg / S.cfg.cqTiempo)) : 0;
    const pts = Math.round((q.puntos + bono) * mult);
    C.ultimosPts = pts; C.puntos += pts; C.res.push(true);
    C.msg = { tipo: 'ok', html: `<strong>¡Correcto! +${pts}</strong> (${q.puntos} base${bono ? ` + ${bono} por velocidad` : ''}${mult > 1 ? ` × ${mult} de racha` : ''}). Respuesta: «${esc(sinParentesis(q.respuesta))}».${q.nota ? ` <span class="tenue">${esc(q.nota)}</span>` : ''}` };
    sonar('ok');
  } else {
    C.racha = 0; C.res.push(false); C.fallos.push({ id: q.id, texto: t });
    if (S.cfg.cqElim) C.strikes++;
    C.msg = { tipo: 'mal', html: `<strong>${agotado ? 'Se acabó el tiempo.' : t ? 'Incorrecta.' : 'Pregunta saltada.'}</strong> La respuesta es «${esc(q.respuesta)}».${t ? ` ${C.porOpcion ? 'Elegiste' : 'Escribiste'} «${esc(t)}».` : ''}${q.nota ? ` <span class="tenue">${esc(q.nota)}</span>` : ''}` };
    sonar('mal');
  }
  C.terminarYa = S.cfg.cqElim && C.strikes >= 3;
  C.fase = 'feedback';
  render();
  const b = $('#btn-sig-cq'); if (b) b.focus({ preventScroll: true });
  if (r.ok && !C.terminarYa) { const ref = C.i; C.auto = setTimeout(() => { if (S.concurso === C && C.i === ref && C.fase === 'feedback' && S.vista === 'concurso') siguienteConcurso(); }, 1600); }
}
function siguienteConcurso() {
  const C = S.concurso;
  if (!C) return;
  clearTimeout(C.auto);
  if (C.terminarYa || C.i + 1 >= C.lista.length) {
    C.fase = 'fin';
    if (C.puntos > S.record.concurso) { S.record.concurso = C.puntos; C.nuevoRecord = true; almacen.set('record', S.record); }
    sonar('fin'); render(); return;
  }
  C.i++; preguntaConcurso(); mostrarPregunta('#quiz-cq');
}
function corregirConcurso() {
  const C = S.concurso;
  if (!C || C.ultimoOk) return;
  const q = C.lista[C.i];
  corregirARegistroCorrecto(q.id, C.prev);
  C.res[C.res.length - 1] = true; C.fallos = C.fallos.filter(f => f.id !== q.id);
  if (S.cfg.cqElim) C.strikes = Math.max(0, C.strikes - 1);
  C.racha++; C.mejorRacha = Math.max(C.mejorRacha, C.racha);
  C.puntos += q.puntos; C.ultimoOk = true; C.terminarYa = S.cfg.cqElim && C.strikes >= 3;
  C.msg = { tipo: 'ok', html: `Corregido: «${esc(C.ultimoTexto)}» se contó como acierto (+${q.puntos}, sin bono).` };
  render();
}

      <div class="flex gap-2"><button type="button" class="btn btn-guinda" data-accion="guardar-doc" ${n ? '' : 'disabled'}>Agregar al banco</button><button type="button" class="btn btn-linea" data-accion="descartar-doc">Descartar</button></div>
    </div>
    ${P.palabras && P.palabras.length ? `<div class="px-5 pt-4"><p class="eyebrow mb-2">Índice de conceptos</p><div class="flex flex-wrap gap-1.5">${P.palabras.map(p => `<span class="chip">${esc(p.w)} <span class="num">${p.c}</span></span>`).join('')}</div></div>` : ''}
    <div class="p-5 flex flex-col gap-4 max-h-[32rem] overflow-y-auto">
      ${P.categorias.map((c, ci) => `<div><h4 class="text-lg font-bold mb-1"><span class="chip chip-cod mr-2">${esc(c.codigo)}</span>${esc(c.nombre)} <span class="tenue text-sm normal-case">(${c.preguntas.length})</span></h4>
        <ul class="flex flex-col">${c.preguntas.map((p, pi) => `<li class="py-2 grid grid-cols-[1fr_auto] gap-3 items-start border-b" style="border-color:var(--linea)">
          <span class="min-w-0 text-sm">${esc(p.pregunta)}<strong class="block" style="color:var(--guinda)">${esc(p.respuesta)}</strong></span>
          <button type="button" class="btn btn-sm btn-linea" data-accion="quitar-preview" data-ci="${ci}" data-pi="${pi}" aria-label="Quitar pregunta">Quitar</button></li>`).join('')}</ul></div>`).join('')}
    </div>
  </div>`;
}
function bancoExportable() {
  const { cats } = banco();
  return { version: 1, generado: new Date().toISOString(), categorias: cats.map(({ docId, docNombre, ...c }) => c) };
}

/* ---------- foco ---------- */
function enfocar(sel, seleccionar = false) {
  requestAnimationFrame(() => {
    const el = $(sel);
    if (!el) return;
    if (window.matchMedia('(pointer: coarse)').matches && el.tagName === 'INPUT' && !seleccionar) return; // en móvil no forzamos el teclado
    el.focus({ preventScroll: true });
    if (seleccionar && el.select) el.select();
  });
}

/* ---------- eventos ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-accion]');
  if (!b || b.disabled) return;
  const a = b.dataset.accion;
  const acciones = {
    'ir': () => ir(b.dataset.vista),
    'tema': () => { S.tema = S.tema === 'dark' ? 'light' : 'dark'; almacen.set('tema', S.tema); aplicarTema(); pintarNav(); },
    'sonido': () => { S.sonido = !S.sonido; almacen.set('sonido', S.sonido); pintarNav(); if (S.sonido) sonar('ok'); },
    'estudiar-cat': () => { detenerRelojes(); S.estudio.cat = b.dataset.cat; S.estudio.tab = 'practica'; armarCola(); ir('estudio'); },
    'opcion-cq': () => { const C = S.concurso, op = C && C.ops[+b.dataset.o]; if (!op || C.fase !== 'pregunta') return; op.elegida = true; responderConcurso(op.texto, false, op.ok); },
    'opcion-est': () => {
      const E = S.estudio, id = E.cola[E.idx], op = E.ops && E.ops[+b.dataset.o];
      if (!op || E.fase !== 'pregunta' || E.opsId !== id) return;
      op.elegida = true;
      E.res = { ok: op.ok, texto: op.texto, prev: registrar(id, op.ok), porOpcion: true };
      E.fase = 'feedback'; sonar(op.ok ? 'ok' : 'mal'); render(); enfocar('#btn-sig-est');
    },
    'modo-resp': () => { S.cfg.modoResp = b.dataset.v; almacen.set('cfg', S.cfg); render(); if (!usaOpciones()) enfocar(S.vista === 'concurso' ? '#resp-cq' : '#resp-est'); },
    'iniciar-concurso': iniciarConcurso,
    'saltar-cq': () => responderConcurso(''),
    'siguiente-cq': siguienteConcurso,
    'corregir-cq': corregirConcurso,
    'abandonar-concurso': () => { detenerRelojes(); clearTimeout(S.concurso?.auto); S.concurso = null; render(); },
    'config-concurso': () => { S.concurso = null; render(); },
    'estudiar-errores': () => { S.concurso = null; S.estudio.tab = 'errores'; S.estudio.cat = 'todas'; armarCola(); ir('estudio'); },
    'tab-estudio': () => { S.estudio.tab = b.dataset.tab; armarCola(); render(); },
    'nolase-est': () => { const E = S.estudio, q = preguntaPorId(E.cola[E.idx]); E.res = { ok: false, texto: '', prev: registrar(q.id, false) }; E.fase = 'feedback'; render(); enfocar('#btn-sig-est'); },
    'sig-est': siguienteEstudio,
    'corregir-est': () => { const E = S.estudio, id = E.cola[E.idx]; corregirARegistroCorrecto(id, E.res.prev); E.res = { ...E.res, ok: true, corregida: true }; render(); },
    'girar': () => { S.estudio.girada = !S.estudio.girada; $('.flash')?.classList.toggle('girada', S.estudio.girada); $$('[data-accion="tarjeta-si"],[data-accion="tarjeta-no"]').forEach(x => { x.disabled = !S.estudio.girada; }); },
    'tarjeta-si': () => { registrar(S.estudio.cola[S.estudio.idx], true); siguienteEstudio(); },
    'tarjeta-no': () => { registrar(S.estudio.cola[S.estudio.idx], false); siguienteEstudio(); },
    'guardar-doc': () => { const P = S.docsUI.preview; P.categorias = P.categorias.filter(c => c.preguntas.length); S.docs.push(P); almacen.set('docs', S.docs); S.docsUI.preview = null; S.docsUI.error = null; render(); },
    'descartar-doc': () => { S.docsUI.preview = null; S.docsUI.error = null; render(); },
    'quitar-preview': () => {
      const P = S.docsUI.preview, c = P.categorias[+b.dataset.ci];
      c.preguntas.splice(+b.dataset.pi, 1);
      render();
    },
    'confirmar-borrar': () => { S.docsUI.confirmar = b.dataset.doc; render(); },
    'cancelar-borrar': () => { S.docsUI.confirmar = null; render(); },
    'borrar-doc': () => { S.docs = S.docs.filter(d => d.id !== b.dataset.doc); almacen.set('docs', S.docs); S.docsUI.confirmar = null; render(); },
    'borrar-progreso': () => { S.stats = {}; guardarStats(); S.record = { concurso: 0 }; almacen.set('record', S.record); S.docsUI.confirmar = null; render(); },
    'ver-json': () => { S.docsUI.verJson = !S.docsUI.verJson; render(); },
    'copiar-json': () => {
      const txt = JSON.stringify(bancoExportable(), null, 2), msg = $('#msg-copia');
      const respaldo = () => { S.docsUI.verJson = true; render(); const t = $('#json-banco'); if (t) { t.focus(); t.select(); } const m = $('#msg-copia'); if (m) m.textContent = 'No se pudo copiar automáticamente: el texto quedó seleccionado, cópialo con Ctrl+C.'; };
      try { navigator.clipboard.writeText(txt).then(() => { if (msg) msg.textContent = 'JSON copiado al portapapeles.'; }, respaldo); } catch (err) { respaldo(); }
    }
  };
  if (acciones[a]) { e.preventDefault(); acciones[a](); }
});
document.addEventListener('click', e => {
  const l = e.target.closest('[data-logo]');
  if (!l) return;
  l.classList.remove('activo'); void l.getBoundingClientRect(); l.classList.add('activo');
  setTimeout(() => l.classList.remove('activo'), 1300);
});
document.addEventListener('submit', e => {
  const f = e.target.closest('[data-form]');
  if (!f) return;
  e.preventDefault();
  const tipo = f.dataset.form;
  if (tipo === 'concurso') responderConcurso($('#resp-cq').value);
  else if (tipo === 'estudio') responderEstudio($('#resp-est').value);
  else if (tipo === 'pegar') {
    const t = $('#texto-pegado').value;
    if (t.trim().length < 10) { S.docsUI.error = 'Pega al menos una pregunta con su respuesta.'; render(); return; }
    S.docsUI.preview = parsearTexto(t, 'Texto pegado ' + new Date().toLocaleDateString('es-MX'));
    S.docsUI.error = S.docsUI.preview.categorias.length ? null : 'No encontré preguntas en el texto pegado.';
    render();
  }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.cfg) {
    const k = t.dataset.cfg;
    S.cfg[k] = t.type === 'checkbox' ? t.checked : (isNaN(+t.value) ? t.value : +t.value);
    almacen.set('cfg', S.cfg);
    if (S.vista === 'concurso') render();
    return;
  }
  const a = t.dataset.accionCambio;
  if (a === 'cat-estudio') { S.estudio.cat = t.value; armarCola(); render(); }
  else if (a === 'archivo' && t.files[0]) procesarArchivo(t.files[0]);
  else if (a === 'activar-doc') {
    if (t.dataset.doc === 'base') { S.baseActiva = t.checked; almacen.set('baseActiva', S.baseActiva); }
    else { const d = S.docs.find(x => x.id === t.dataset.doc); if (d) { d.activo = t.checked; almacen.set('docs', S.docs); } }
    S.concurso = null; armarCola(); render();
  }
});
document.addEventListener('input', e => {
  if (e.target.dataset.accionInput === 'buscar-guia') {
    S.estudio.busqueda = e.target.value;
    const tmp = document.createElement('div'); tmp.innerHTML = guiaHTML();
    $('#guia-res').innerHTML = tmp.querySelector('#guia-res').innerHTML;
  }
});
document.addEventListener('keydown', e => {
  if (!e.ctrlKey && !e.metaKey && !e.altKey && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName || '')) {
    let k = e.key.length === 1 ? e.key.toUpperCase() : '';
    if (/^[1-9]$/.test(k)) k = LETRAS[+k - 1];
    const btn = k && $(`#v-${S.vista} [data-tecla="${k}"]`);
    if (btn) { e.preventDefault(); btn.click(); return; }
  }
  if (S.vista !== 'estudio' || S.estudio.tab !== 'tarjetas' || /INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName)) return;
  if (e.code === 'Space' && document.activeElement?.dataset.accion !== 'girar') { e.preventDefault(); $('[data-accion="girar"]')?.click(); }
  else if (S.estudio.girada && (e.key === 'ArrowRight' || e.key === '1')) $('[data-accion="tarjeta-si"]')?.click();
  else if (S.estudio.girada && (e.key === 'ArrowLeft' || e.key === '2')) $('[data-accion="tarjeta-no"]')?.click();
});
['dragenter', 'dragover'].forEach(ev => document.addEventListener(ev, e => {
  const z = e.target.closest?.('#zona-soltar'); if (!z) return; e.preventDefault(); z.classList.add('encima');
}));
['dragleave', 'drop'].forEach(ev => document.addEventListener(ev, e => {
  const z = e.target.closest?.('#zona-soltar'); if (!z) return; e.preventDefault(); z.classList.remove('encima');
  if (ev === 'drop' && e.dataTransfer.files[0]) procesarArchivo(e.dataTransfer.files[0]);
}));

/* ---------- arranque ---------- */
aplicarTema();
$('#logo-mini').innerHTML = logoSVG(40);
const ancla = (location.hash || '').slice(1);
if (VISTAS.some(([id]) => id === ancla)) S.vista = ancla;
render();

// Expuesto para pruebas y depuración desde la consola.
window.Loboitos = { evaluar, opcionesPara, todasPreguntas, parsearTexto, banco: () => bancoExportable(), BASE };
})();
</script>
</body>
</html>
