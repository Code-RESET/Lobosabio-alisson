<!doctype html>
<!-- Plantilla de Lobitos. index.html se genera con «npm run build»; edita este archivo, no el generado. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lobitos Trivia</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F2F2F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lobitos">
<meta name="application-name" content="Lobitos">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icons/icono.svg">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="Trivia de opción múltiple para dominar la guía LoboSabio. Creada por el Ing. Luis Angel Díaz Bernal.">
<meta name="author" content="Ing. Luis Angel Díaz Bernal">
<!-- @estilos -->
</head>
<body>
<div id="app" class="app min-h-full flex flex-col">

  <header class="encabezado">
    <div class="gutter max-w-6xl mx-auto flex items-center gap-3 py-2">
      <button type="button" class="flex items-center gap-2 min-w-0" data-accion="ir" data-vista="inicio" aria-label="Ir al inicio">
        <span id="logo-mini"></span>
        <span class="marca">Lob<b>itos</b></span>
      </button>
      <nav class="hidden md:inline-flex nav-seg mx-auto" aria-label="Secciones" id="nav-escritorio"></nav>
      <div class="flex items-center gap-2 ml-auto md:ml-0">
        <button type="button" class="icono-btn" data-accion="sonido" id="btn-sonido" aria-pressed="true"></button>
        <button type="button" class="icono-btn" data-accion="tema" id="btn-tema"></button>
      </div>
    </div>
  </header>

  <main class="principal gutter max-w-6xl mx-auto w-full flex-1 py-6 md:py-8">
    <section id="v-inicio" data-vista-sec="inicio"></section>
    <section id="v-concurso" data-vista-sec="concurso" hidden></section>
    <section id="v-estudio" data-vista-sec="estudio" hidden></section>
    <section id="v-cultura" data-vista-sec="cultura" hidden></section>
    <section id="v-documentos" data-vista-sec="documentos" hidden></section>
  </main>

  <footer class="gutter w-full py-6 text-center text-sm tenue">
    <p>Desarrollado por <strong style="color:var(--tinta)">Ing. Luis Angel Díaz Bernal</strong></p>
    <p class="text-xs mt-1">Lobitos · © 2026</p>
  </footer>

  <nav class="tabbar" aria-label="Secciones" id="nav-movil"></nav>
</div>

<script>
<!-- @app -->
</script>
</body>
</html>
